<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="260" viewBox="0 0 1450 260">
  <text x="725" y="58" text-anchor="middle" fill="#B8D7CF" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">THE MISSING LAYER</text>
  <text x="725" y="144" text-anchor="middle" fill="#F5F2EA" font-family="Arial, sans-serif" font-size="62" font-weight="700">Context does not accumulate.</text>
  <text x="725" y="202" text-anchor="middle" fill="#C8924F" font-family="Arial, sans-serif" font-size="28" font-weight="700">WAKE was built to change that.</text>
</svg>
