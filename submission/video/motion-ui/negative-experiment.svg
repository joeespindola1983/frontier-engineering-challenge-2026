    <text x="166" y="702" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#173c35">passed.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="506" width="500" height="274" rx="28" fill="#e6f0ed"/>
